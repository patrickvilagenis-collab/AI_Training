{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#58cc02">
    <meta name="description" content="Learn AI in 5-minute bite-sized lessons. Streaks, XP and levels keep you coming back.">
    <title>AI Trainer — Learn AI in 5 minutes a day</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="{% static 'core/css/styles.css' %}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
</head>
<body>
    <!-- CSRF token for the optional account API -->
    {% csrf_token %}

    <!-- App root; everything is rendered by app.js -->
    <div id="app"></div>

    <!-- Toast / feedback layer -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="{% static 'core/js/app.js' %}"></script>
</body>
</html>
